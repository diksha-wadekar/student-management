<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <defs>
    <!-- Open book -->
    <g id="book">
      <path d="M0,6 C9,1 17,1 21,6 C25,1 33,1 42,6 L42,21 C33,16 25,16 21,21 C17,16 9,16 0,21 Z"
            fill="none" stroke="#7a2e2e" stroke-width="1.6" stroke-linejoin="round" />
      <line x1="21" y1="6" x2="21" y2="21" stroke="#7a2e2e" stroke-width="1.6" />
    </g>
    <!-- Graduation cap -->
    <g id="cap">
      <path d="M17,0 L34,7 L17,14 L0,7 Z" fill="none" stroke="#1f2a3c" stroke-width="1.6" stroke-linejoin="round" />
      <path d="M9,9.5 L9,16 C9,18.5 24.5,18.5 24.5,16 L24.5,9.5" fill="none" stroke="#1f2a3c" stroke-width="1.6" />
      <line x1="34" y1="7" x2="34" y2="17" stroke="#1f2a3c" stroke-width="1.6" />
      <circle cx="34" cy="19.5" r="2" fill="none" stroke="#1f2a3c" stroke-width="1.4" />
    </g>
    <!-- Pencil -->
    <g id="pencil">
      <path d="M2,26 L20,8 L26,14 L8,32 Z" fill="none" stroke="#7a2e2e" stroke-width="1.6" stroke-linejoin="round" />
      <line x1="16" y1="12" x2="22" y2="18" stroke="#7a2e2e" stroke-width="1.4" />
      <path d="M2,26 L5,31 L8,32 L4,29 Z" fill="none" stroke="#7a2e2e" stroke-width="1.4" stroke-linejoin="round" />
    </g>
    <!-- Diploma scroll -->
    <g id="scroll">
      <rect x="2" y="6" width="24" height="12" rx="4" fill="none" stroke="#1f2a3c" stroke-width="1.6" />
      <line x1="9" y1="10" x2="19" y2="10" stroke="#1f2a3c" stroke-width="1.2" />
      <line x1="9" y1="14" x2="17" y2="14" stroke="#1f2a3c" stroke-width="1.2" />
      <circle cx="5" cy="20" r="2.4" fill="none" stroke="#1f2a3c" stroke-width="1.2" />
      <line x1="5" y1="22.4" x2="5" y2="27" stroke="#1f2a3c" stroke-width="1.2" />
    </g>
  </defs>

  <g opacity="0.16">
    <use href="#book" x="14" y="18" />
    <use href="#cap" x="150" y="10" />
    <use href="#pencil" x="205" y="150" />
    <use href="#scroll" x="30" y="150" />
    <use href="#book" x="180" y="195" />
    <use href="#cap" x="60" y="90" transform="rotate(-8 79 104)" />
    <use href="#pencil" x="110" y="200" transform="rotate(20 123 216)" />
  </g>
</svg>
